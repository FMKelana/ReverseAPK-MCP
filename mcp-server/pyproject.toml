[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reverseapk-mcp"
version = "0.1.0"
description = "MCP server that exposes Android APK reverse engineering tooling to AI agents on Windows"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
reverseapk-mcp = "reverseapk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reverseapk_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
